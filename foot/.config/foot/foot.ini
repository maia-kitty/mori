# Ported from ~/.config/kitty/kitty.conf and everforest-dark-medium.conf
# Nerd Font fallback replaces Kitty’s explicit symbol_map.
font=IBM Plex Mono:size=12,Symbols Nerd Font:size=12
font-size-adjustment=1
pad=16x16
# Kitty padding is 12 points; 16 pixels matches at standard 96 DPI.
selection-target=both

[scrollback]
lines=3000

[cursor]
style=beam
blink=yes
blink-rate=1000

[bell]
system=no

[csd]
preferred=none

[colors-dark]
alpha=1.0
# Blur strength is compositor-controlled; the current opaque background hides it.
blur=yes
foreground=d3c6aa
background=2d353b
selection-foreground=9da9a0
selection-background=505a60
cursor=343f44 d3c6aa
urls=7fbbb3
regular0=343f44
regular1=e67e80
regular2=a7c080
regular3=dbbc7f
regular4=7fbbb3
regular5=d699b6
regular6=83c092
regular7=859289
bright0=868d80
bright1=e67e80
bright2=a7c080
bright3=dbbc7f
bright4=7fbbb3
bright5=d699b6
bright6=83c092
bright7=9da9a0

[key-bindings]
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

# Kitty tabs, cursor trail, and automatic shell integration have no
# direct foot.ini equivalents. Foot manages font zoom per window.
# Foot’s selection trimming differs from Kitty’s smart trailing-space mode.
