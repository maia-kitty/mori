# Mori's login screen: greetd runs a small Niri (as the greeter user) that
# shows /usr/share/mori-greeter/shell.qml. Installed by mori-greeter-install,
# which fills in this system's terminal and greeter user.
[terminal]
vt = 1

[default_session]
command = "niri -c /usr/share/mori-greeter/niri.kdl"
user = "greeter"
